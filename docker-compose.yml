services:
  # ==========================================
  # DATABASE: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: akt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akt_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-akt_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - akt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akt_user} -d ${POSTGRES_DB:-akt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - akt_network

  # ==========================================
  # BACKEND: Express TypeScript API
  # ==========================================
  backend:
    build:
      context: ./akt-be
      dockerfile: Dockerfile
    container_name: akt_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-akt_user}:${POSTGRES_PASSWORD:-akt_secure_password_2026}@postgres:5432/${POSTGRES_DB:-akt_db}
      JWT_SECRET: ${JWT_SECRET:-akt_jwt_super_secret_production_key_2026_xyz}
      CORS_ORIGIN: http://localhost:3002,http://127.0.0.1:3002
      CLIENT_URL: http://localhost:3002
      WEBHOOK_HOST: ${WEBHOOK_HOST:-}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - akt_network

  # ==========================================
  # FRONTEND: Next.js 16 Web Dashboard
  # ==========================================
  frontend:
    build:
      context: ./akt-fe
      dockerfile: Dockerfile
    container_name: akt_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - akt_network

volumes:
  akt_postgres_data:
    name: akt_postgres_data

networks:
  akt_network:
    name: akt_network
    driver: bridge
